<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MyVM - OS embed</title>
    <style>
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <iframe id="meu-iframe" title="loader"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const linkUrl = params.get('t');

        if (linkUrl) {
            document.getElementById('meu-iframe').src = decodeURIComponent(linkUrl);
        } else {
            document.getElementById('meu-iframe').srcdoc = "<p style='font-family:sans-serif; text-align:center; padding:20px;'>Nenhum link informado no parâmetro ?t=</p>";
        }
    </script>
<hr>
<p>Embed with MyVM</p>
</body>
</html>
